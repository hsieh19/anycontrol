# ==============================================================================
# AnyControl 工业设备控制与审计平台 - Docker Compose 生产部署编排配置
# 
# 常用运维命令：
#   1. 启动服务 (后台运行并重新构建):  docker compose up -d --build
#   2. 查看实时运行日志:              docker compose logs -f anycontrol-app
#   3. 查看容器运行状态:              docker compose ps
#   4. 停止并移除容器:                docker compose down
#   5. 重启服务:                      docker compose restart anycontrol-app
# ==============================================================================

services:
  anycontrol-app:
    # --------------------------------------------------------------------------
    # 1. 镜像构建配置
    # --------------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile
    image: anycontrol:latest
    container_name: anycontrol-industrial
    
    # 容器崩溃或宿主机重启后自动拉起 (生产环境推荐 unless-stopped 或 always)
    restart: unless-stopped

    # --------------------------------------------------------------------------
    # 2. 网络端口映射 (格式: "宿主机访问端口:容器内部端口")
    # --------------------------------------------------------------------------
    # 说明：
    #   - 容器内部固定监听 3000 端口 (已整合 SPA 前端、REST API 与 WebSocket)
    #   - 默认映射到宿主机的 3000 端口；若需使用 80 端口访问，直接修改为 "80:3000"
    ports:
      - "3000:3000"

    # --------------------------------------------------------------------------
    # 3. 环境变量配置 (直接在此修改即可，无需任何 .env 文件)
    # --------------------------------------------------------------------------
    environment:
      - NODE_ENV=production
      - PORT=3000
      
      # [必填] JWT 令牌签名密钥 (生产环境请务必修改为自定义的强随机字符串，至少 32 位)
      # 生成示例: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - JWT_SECRET=anycontrol-production-jwt-secret-please-change-to-random-string

      # [可选] 飞书开放平台企业自建应用凭证 (用于扫码免登，不启用可保持留空)
      - FEISHU_APP_ID=
      - FEISHU_APP_SECRET=
      # 飞书授权回调地址 (通常为: http://您的服务器IP或域名:端口/)
      - FEISHU_REDIRECT_URI=http://127.0.0.1:3000/

    # --------------------------------------------------------------------------
    # 5. 持久化数据卷挂载 (Volume)
    # --------------------------------------------------------------------------
    # 说明：
    #   - 容器内 /app/server/data 保存了 SQLite 数据库 (anycontrol.db) 与操作审计历史
    #   - 默认使用 Docker 托管的具名卷 anycontrol-data，容器销毁或更新镜像时数据不丢失
    #   - [备选方案] 如需直接映射到宿主机物理目录，可将下方行替换为:
    #       - ./data:/app/server/data
    volumes:
      - anycontrol-data:/app/server/data

# ------------------------------------------------------------------------------
# 6. 数据卷声明
# ------------------------------------------------------------------------------
volumes:
  anycontrol-data:
    driver: local
